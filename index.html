<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>웹소설 키워드 조합기</title>
<style>
:root{--ink:#4a4560;--mute:#9a93b3;--pink:#ffd6e4;--pinkD:#ff8fb5;--sky:#d6ecff;--skyD:#6fb3ff;--mint:#d4f5e6;--lav:#e8e0ff;--lavD:#9b86f0;--lem:#fff3c4;--peach:#ffe2d1}
*{box-sizing:border-box}
body{margin:0;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);font-size:15px;
 background:radial-gradient(circle at 10% 10%,#ffe9f2 0,transparent 40%),radial-gradient(circle at 90% 20%,#e3f1ff 0,transparent 40%),radial-gradient(circle at 50% 100%,#efe8ff 0,transparent 50%),#fdfbff;min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:26px;margin:0;letter-spacing:-.5px}h1 span{font-size:26px}
.sub{color:var(--mute);font-size:13px;margin-top:4px}
.cloud{background:rgba(255,255,255,.75);backdrop-filter:blur(8px);border-radius:32px;padding:22px 24px;margin-top:18px;box-shadow:0 10px 30px rgba(155,134,240,.12),inset 0 0 0 1.5px rgba(255,255,255,.9)}
.ttl{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;margin-bottom:14px}
.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px}
.pill{border:none;border-radius:999px;padding:9px 18px;font-size:15px;cursor:pointer;background:#f4f1fb;color:var(--ink);transition:.18s;font-family:inherit}
.pill:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.07)}
.pill small{opacity:.55;margin-left:4px;font-size:12px}
.o .pill.on{background:var(--pinkD);color:#fff}.g .pill.on{background:var(--skyD);color:#fff}.p .pill.on{background:#5cc99a;color:#fff}
.sticky{position:sticky;top:12px;z-index:5}
.combo{background:linear-gradient(135deg,#fff 0,#fbf7ff 100%);border-radius:36px;padding:20px 24px;margin-top:18px;box-shadow:0 14px 36px rgba(155,134,240,.2)}
.combo .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.big{font-size:15px}.big b{font-size:28px;color:var(--lavD)}
.combo .sel{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;min-height:48px;align-items:center}
.bub{border-radius:999px;padding:10px 18px 10px 20px;font-size:17px;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center;animation:pop .25s}
.bub.in{background:var(--lavD);color:#fff;box-shadow:0 6px 16px rgba(155,134,240,.4)}
.bub.ex{background:#fff;color:#e36b8f;border:2px dashed #f5a3bb;text-decoration:line-through}
.bub i{font-style:normal;opacity:.7;font-size:14px}
.plus{color:var(--mute);font-weight:700}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.tog{display:inline-flex;background:#f1ecff;border-radius:999px;padding:4px}
.tog button{border:none;background:none;border-radius:999px;padding:7px 16px;cursor:pointer;font-family:inherit;color:var(--mute);font-weight:700}
.tog button.on{background:#fff;color:var(--lavD);box-shadow:0 2px 8px rgba(155,134,240,.25)}
.ghost{border:none;background:#fff0f5;color:#e36b8f;border-radius:999px;padding:8px 16px;cursor:pointer;font-family:inherit;font-weight:700}
.search{width:100%;border:none;background:#f6f3fd;border-radius:999px;padding:13px 20px;font-size:15px;font-family:inherit;outline:none;color:var(--ink)}
.search:focus{box-shadow:0 0 0 3px #e0d6ff}
.hint{color:var(--mute);font-size:13px;margin:10px 4px 0}
.layer{margin-top:22px}
.lh{font-size:13px;font-weight:700;display:inline-block;padding:5px 14px;border-radius:999px;margin-bottom:12px}
.kw{border:none;border-radius:999px;cursor:pointer;font-family:inherit;color:var(--ink);transition:.18s;line-height:1.1;position:relative}
.kw:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 8px 18px rgba(0,0,0,.08)}
.kw sup{font-size:11px;opacity:.55;margin-left:3px}
.kw.on{background:var(--lavD)!important;color:#fff;box-shadow:0 6px 16px rgba(155,134,240,.45)}
.kw.ex{background:#fff!important;color:#e36b8f;outline:2px dashed #f5a3bb;text-decoration:line-through}
.kw.zero{opacity:.3}
.more{border:none;background:none;color:var(--lavD);cursor:pointer;font-weight:700;font-family:inherit;margin-top:8px}
#tip{position:fixed;max-width:300px;background:#4a4560;color:#fff;padding:10px 14px;border-radius:18px;font-size:13px;display:none;z-index:9;pointer-events:none;line-height:1.5}
.empty{color:var(--mute)}
</style></head><body><div class="wrap">
<h1><span>☁️</span> 웹소설 키워드 조합기</h1>

<div class="cloud o"><div class="ttl"><span class="num" style="background:var(--pinkD)">1</span>성향</div><div class="row" id="f_o"></div></div>
